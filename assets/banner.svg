<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">Camera Roll Paper Rescue</title>
  <desc id="d">Paper photos on a dark scanner bed. A teal scan line passes over a receipt, a sticky note, a ticket, and an ID card. Each is framed and labeled; the card is labeled text withheld.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38E0C0" stop-opacity="0"/>
      <stop offset="1" stop-color="#38E0C0" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38E0C0" stop-opacity="0"/>
      <stop offset=".12" stop-color="#38E0C0"/>
      <stop offset=".88" stop-color="#38E0C0"/>
      <stop offset="1" stop-color="#38E0C0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .scan{animation:sweep 7s ease-in-out infinite alternate}
    @keyframes sweep{from{transform:translateY(0)}to{transform:translateY(250px)}}
    @media (prefers-reduced-motion:reduce){.scan{animation:none;transform:translateY(130px)}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#1C222C"/>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- left: title -->
    <text x="64" y="104" class="mono" font-size="15" letter-spacing="2.5" fill="#38E0C0">ULIYA SKILL · UGREEN AI NAS</text>
    <text x="61" y="176" class="sans" font-size="58" font-weight="700" fill="#F5F7FA">Camera Roll</text>
    <text x="61" y="242" class="sans" font-size="58" font-weight="700" fill="#F5F7FA"><tspan fill="#38E0C0">Paper</tspan> Rescue</text>
    <text x="64" y="290" class="sans" font-size="19" fill="#A9B4C2">Finds the paper photos in a NAS folder,</text>
    <text x="64" y="316" class="sans" font-size="19" fill="#A9B4C2">lets you review them, then saves their text.</text>
    <g class="mono" font-size="13">
      <rect x="64.5" y="344.5" width="60" height="27" rx="13.5" fill="none" stroke="#38E0C0"/>
      <text x="94.5" y="362.5" text-anchor="middle" fill="#38E0C0">CRPR</text>
      <rect x="136.5" y="344.5" width="160" height="27" rx="13.5" fill="none" stroke="#5B6675"/>
      <text x="216.5" y="362.5" text-anchor="middle" fill="#A9B4C2">50 photos per run</text>
      <rect x="308.5" y="344.5" width="176" height="27" rx="13.5" fill="none" stroke="#5B6675"/>
      <text x="396.5" y="362.5" text-anchor="middle" fill="#A9B4C2">originals untouched</text>
    </g>

    <!-- right: scanner brackets -->
    <g fill="none" stroke="#38E0C0" stroke-width="3" stroke-opacity=".8">
      <path d="M704 50V20H734"/><path d="M1226 20H1256V50"/>
      <path d="M704 350V380H734"/><path d="M1226 380H1256V350"/>
    </g>

    <!-- receipt -->
    <g transform="translate(735 62) rotate(-4 70 115)">
      <path filter="url(#shadow)" fill="#F4F1EA" d="M0 0H140V218L130 230L120 218L110 230L100 218L90 230L80 218L70 230L60 218L50 230L40 218L30 230L20 218L10 230L0 218Z"/>
      <rect x="30" y="18" width="80" height="10" rx="2" fill="#B9B2A5"/>
      <rect x="45" y="34" width="50" height="6" rx="2" fill="#D3CDC1"/>
      <g fill="#C9C3B6">
        <rect x="16" y="58" width="62" height="6" rx="2"/><rect x="100" y="58" width="24" height="6" rx="2"/>
        <rect x="16" y="74" width="48" height="6" rx="2"/><rect x="100" y="74" width="24" height="6" rx="2"/>
        <rect x="16" y="90" width="70" height="6" rx="2"/><rect x="100" y="90" width="24" height="6" rx="2"/>
        <rect x="16" y="106" width="54" height="6" rx="2"/><rect x="100" y="106" width="24" height="6" rx="2"/>
        <rect x="16" y="122" width="40" height="6" rx="2"/><rect x="100" y="122" width="24" height="6" rx="2"/>
      </g>
      <path d="M16 142H124" stroke="#B5AE9F" stroke-dasharray="4 3"/>
      <rect x="16" y="154" width="46" height="9" rx="2" fill="#5E574C"/><rect x="88" y="154" width="36" height="9" rx="2" fill="#5E574C"/>
      <g fill="#3E3932">
        <rect x="24" y="178" width="3" height="24"/><rect x="30" y="178" width="1.5" height="24"/><rect x="34" y="178" width="4" height="24"/>
        <rect x="41" y="178" width="2" height="24"/><rect x="46" y="178" width="1.5" height="24"/><rect x="50" y="178" width="3" height="24"/>
        <rect x="56" y="178" width="1.5" height="24"/><rect x="60" y="178" width="4" height="24"/><rect x="67" y="178" width="2" height="24"/>
        <rect x="72" y="178" width="3" height="24"/><rect x="78" y="178" width="1.5" height="24"/><rect x="82" y="178" width="2" height="24"/>
        <rect x="87" y="178" width="4" height="24"/><rect x="94" y="178" width="1.5" height="24"/><rect x="98" y="178" width="3" height="24"/>
        <rect x="104" y="178" width="2" height="24"/><rect x="109" y="178" width="3" height="24"/><rect x="114" y="178" width="1.5" height="24"/>
      </g>
      <rect x="-10" y="-10" width="160" height="252" rx="6" fill="none" stroke="#38E0C0" stroke-width="2" stroke-dasharray="7 5"/>
      <rect x="-10" y="-36" width="74" height="22" rx="4" fill="#38E0C0"/>
      <text x="27" y="-20" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0E1A1A">receipt</text>
    </g>

    <!-- sticky note -->
    <g transform="translate(918 70) rotate(3 62 62)">
      <rect width="124" height="124" rx="2" fill="#F6D97A" filter="url(#shadow)"/>
      <rect x="40" y="-8" width="44" height="16" fill="#FFFFFF" fill-opacity=".38" transform="rotate(-3 62 0)"/>
      <g fill="none" stroke="#7A6420" stroke-width="2.2" stroke-linecap="round">
        <path d="M16 36q8-6 16 0t16 0t16 0t16 0t16 0"/>
        <path d="M16 58q8-6 16 0t16 0t16 0t16 0"/>
        <path d="M16 80q8-6 16 0t16 0t16 0t16 0t16 0"/>
        <path d="M16 102q8-6 16 0t16 0"/>
      </g>
      <rect x="-10" y="-10" width="144" height="144" rx="6" fill="none" stroke="#38E0C0" stroke-width="2" stroke-dasharray="7 5"/>
      <rect x="-10" y="-36" width="60" height="22" rx="4" fill="#38E0C0"/>
      <text x="20" y="-20" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0E1A1A">notes</text>
    </g>

    <!-- id card, text withheld -->
    <g transform="translate(1082 96) rotate(-3 76 48)">
      <rect width="152" height="96" rx="10" fill="#E6E1D8" filter="url(#shadow)"/>
      <rect x="12" y="16" width="34" height="42" rx="3" fill="#B9B2A5"/>
      <g fill="#8E877A" filter="url(#blur)">
        <rect x="56" y="18" width="80" height="8" rx="3"/>
        <rect x="56" y="34" width="64" height="8" rx="3"/>
        <rect x="56" y="50" width="72" height="8" rx="3"/>
        <rect x="12" y="72" width="124" height="9" rx="3"/>
      </g>
      <rect x="-10" y="-10" width="172" height="116" rx="6" fill="none" stroke="#E8664A" stroke-width="2" stroke-dasharray="7 5"/>
      <rect x="-10" y="-36" width="172" height="22" rx="4" fill="#E8664A"/>
      <text x="76" y="-20" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#FFFFFF">card · text withheld</text>
    </g>

    <!-- ticket -->
    <g transform="translate(915 262) rotate(-2 115 44)">
      <path filter="url(#shadow)" fill="#CFE3F5" d="M0 0H230V32A12 12 0 0 0 230 56V88H0V56A12 12 0 0 0 0 32Z"/>
      <path d="M162 6V82" stroke="#7FA3C4" stroke-width="1.5" stroke-dasharray="3 4"/>
      <rect x="20" y="18" width="92" height="10" rx="2" fill="#5D7E9E"/>
      <rect x="20" y="40" width="120" height="7" rx="2" fill="#9DB9D3"/>
      <rect x="20" y="56" width="70" height="7" rx="2" fill="#9DB9D3"/>
      <g fill="#4A6A8A">
        <rect x="178" y="22" width="10" height="10"/><rect x="192" y="22" width="6" height="6"/><rect x="202" y="22" width="10" height="10"/>
        <rect x="178" y="38" width="6" height="6"/><rect x="190" y="36" width="10" height="10"/><rect x="204" y="40" width="6" height="6"/>
        <rect x="178" y="54" width="10" height="10"/><rect x="194" y="52" width="6" height="6"/><rect x="202" y="54" width="10" height="10"/>
      </g>
      <rect x="-10" y="-10" width="250" height="108" rx="6" fill="none" stroke="#38E0C0" stroke-width="2" stroke-dasharray="7 5"/>
      <rect x="-10" y="-36" width="64" height="22" rx="4" fill="#38E0C0"/>
      <text x="22" y="-20" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#0E1A1A">ticket</text>
    </g>

    <!-- scan line -->
    <g class="scan">
      <rect x="700" y="10" width="560" height="60" fill="url(#beam)"/>
      <rect x="700" y="67" width="560" height="6" fill="url(#line)" filter="url(#glow)"/>
      <rect x="700" y="69" width="560" height="2" fill="url(#line)"/>
    </g>
  </g>
</svg>
